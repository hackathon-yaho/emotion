# 앱 웹 빌드 · GitHub Pages 배포
#
# 팀원이 URL 하나로 화면을 보게 하는 경로입니다. `app/` 아래가 바뀔 때만 돕니다.
#
# ⚠️ 켜기 전에 저장소 설정에서 한 번 해줘야 하는 것:
#    Settings → Pages → Build and deployment → Source: **GitHub Actions**
#    (이 저장소는 비공개입니다. 비공개 저장소의 Pages는 유료 플랜에서만
#     동작하므로, 무료 플랜이면 아래 "대안"을 씁니다 — app/README 참조)
#
# 배포 주소: https://hackathon-yaho.github.io/emotion/
name: app-web

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 게이트 — 셋 다 통과해야 배포한다
      - run: flutter analyze
      - run: flutter test
      - name: Build web
        run: |
          flutter build web --release \
            --base-href /emotion/ \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'http://localhost:8080' }} \
            --dart-define=KAKAO_JS_KEY=${{ vars.KAKAO_JS_KEY }} \
            --dart-define=SAMPLE_DATA=${{ vars.SAMPLE_DATA }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
