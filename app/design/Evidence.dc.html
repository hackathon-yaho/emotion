<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    .n a { color: var(--accent); text-decoration: none; }
    .n a:hover { opacity: 0.75; }
    .n-dark {
      --bg: #0D0D0C; --lift: #161614; --paper: #F2EFE9; --muted: #8A8781; --faint: #55534E;
      --line: rgba(242,239,233,0.12); --hair: rgba(242,239,233,0.07);
      --accent: #C98A4B; --care: #C98087; --cool: #5A8FC9; --warm: #C25A38;
      --shade: rgba(242,239,233,0.07); --onAccent: #0D0D0C;
    }
    .n-light {
      --bg: #F5F2EC; --lift: #FFFFFF; --paper: #1A1815; --muted: #6B675F; --faint: #9A968D;
      --line: rgba(26,24,21,0.14); --hair: rgba(26,24,21,0.07);
      --accent: #8A5A22; --care: #A85A62; --cool: #2F6FA8; --warm: #B5411F;
      --shade: rgba(26,24,21,0.06); --onAccent: #FFFFFF;
    }
    .n { font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .n .serif { font-family: 'Gowun Batang', 'Noto Sans KR', serif; }
    .n .lab { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); }
    .n button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
    .n .dbl { position: relative; }
    .n .dbl .under { position: absolute; left: 3px; top: 3px; color: var(--warm); opacity: 0.45; }
    .n .dbl .over { position: relative; }
  </style>
</helmet>

<div class="n {{th.cls}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; padding: 40px 24px 0 24px">
    <button style="width: 44px; height: 44px; display: flex; align-items: center; color: var(--muted); margin-left: -12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 24px; overflow: hidden">
    <div style="padding: 24px 0 0 0">
      <p class="lab" style="margin: 0 0 18px 0">이 관찰의 근거</p>
      <p class="serif" style="margin: 0; font-size: 24px; line-height: 1.7; text-wrap: pretty">회의 얘기를 하실 때만 목소리가 유독 무거워지시네요.</p>
    </div>

    <div style="display: flex; align-items: baseline; gap: 14px; padding: 24px 0 8px 0">
      <p style="margin: 0; font-size: 13px; color: var(--muted)">회의 7회</p>
      <span style="width: 1px; height: 11px; background: var(--line)"></span>
      <p style="margin: 0; font-size: 13px; color: var(--muted)">태그 평균 갭 1.31</p>
      <span style="width: 1px; height: 11px; background: var(--line)"></span>
      <p style="margin: 0; font-size: 13px; color: var(--muted)">내 평균 0.72</p>
    </div>
    <div style="display: flex; gap: 20px; padding: 0 0 20px 0">
      <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 2px; background: var(--cool)"></span><span style="font-size: 12px; color: var(--faint)">말한 내용</span></div>
      <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 2px; background: var(--warm)"></span><span style="font-size: 12px; color: var(--faint)">목소리</span></div>
    </div>

    <div style="display: flex; flex-direction: column">
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px 0">
        <p class="lab" style="margin: 0">9.12 13:20</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: var(--paper); text-wrap: pretty">오늘 회의가 세 개나 있었는데 다 괜찮았어요</p>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--cool); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">0.62</span></div>
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--warm); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">−0.58</span></div>
          <span style="width: 1px; height: 10px; background: var(--line)"></span>
          <span style="font-size: 12px; color: var(--paper)">갭 1.20</span>
        </div>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px 0">
        <p class="lab" style="margin: 0">9.11 22:04</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: var(--paper); text-wrap: pretty">회의 끝나고 나면 왜 이렇게 진이 빠지는지</p>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--cool); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">0.34</span></div>
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--warm); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">−1.08</span></div>
          <span style="width: 1px; height: 10px; background: var(--line)"></span>
          <span style="font-size: 12px; color: var(--paper)">갭 1.42</span>
        </div>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 20px 0">
        <p class="lab" style="margin: 0">9.08 21:38</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: var(--paper); text-wrap: pretty">내일도 회의라서 좀 그렇네요</p>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--cool); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">0.48</span></div>
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--warm); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">−0.70</span></div>
          <span style="width: 1px; height: 10px; background: var(--line)"></span>
          <span style="font-size: 12px; color: var(--paper)">갭 1.18</span>
        </div>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
    </div>

    <p style="margin: 24px 0 0 0; font-size: 13px; line-height: 1.7; color: var(--faint); text-wrap: pretty">7건 중 3건입니다. 아래로 내려 나머지를 볼 수 있습니다.</p>
    <div style="flex-grow: 1"></div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "section": "테마"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { th: { cls: theme === 'light' ? 'n-light' : 'n-dark' } };
  }
}
</script>
</body>
</html>
