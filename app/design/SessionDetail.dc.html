<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    .n a { color: var(--accent); text-decoration: none; }
    .n a:hover { opacity: 0.75; }
    .n-dark {
      --bg: #0D0D0C; --lift: #161614; --paper: #F2EFE9; --muted: #8A8781; --faint: #55534E;
      --line: rgba(242,239,233,0.12); --hair: rgba(242,239,233,0.07);
      --accent: #C98A4B; --care: #C98087; --cool: #5A8FC9; --warm: #C25A38;
      --shade: rgba(242,239,233,0.07); --onAccent: #0D0D0C;
    }
    .n-light {
      --bg: #F5F2EC; --lift: #FFFFFF; --paper: #1A1815; --muted: #6B675F; --faint: #9A968D;
      --line: rgba(26,24,21,0.14); --hair: rgba(26,24,21,0.07);
      --accent: #8A5A22; --care: #A85A62; --cool: #2F6FA8; --warm: #B5411F;
      --shade: rgba(26,24,21,0.06); --onAccent: #FFFFFF;
    }
    .n { font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .n .serif { font-family: 'Gowun Batang', 'Noto Sans KR', serif; }
    .n .lab { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); }
    .n button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
    .n .dbl { position: relative; }
    .n .dbl .under { position: absolute; left: 3px; top: 3px; color: var(--warm); opacity: 0.45; }
    .n .dbl .over { position: relative; }
  </style>
</helmet>

<div class="n {{th.cls}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 40px 24px 0 24px">
    <button style="width: 44px; height: 44px; display: flex; align-items: center; color: var(--muted); margin-left: -12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <button style="height: 44px; font-size: 13px; color: var(--muted)">삭제</button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 24px; overflow: hidden">
    <div style="padding: 20px 0 0 0">
      <p class="lab" style="margin: 0 0 14px 0">9월 14일 목요일 · 21:30 · 3분 34초</p>
      <p class="serif" style="margin: 0; font-size: 22px; line-height: 1.7; text-wrap: pretty">회의가 많았던 하루에 대해 이야기했습니다.</p>
    </div>
    <div style="padding: 28px 0 0 0; display: flex; flex-direction: column">
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 22px 0">
        <p style="margin: 0; font-size: 16px; line-height: 1.75; color: var(--paper); text-wrap: pretty">오늘 완전 괜찮았어요</p>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--cool); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">0.70</span></div>
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--warm); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">−0.62</span></div>
          <span style="width: 1px; height: 10px; background: var(--line)"></span>
          <span style="font-size: 12px; color: var(--muted)">갭 1.32</span>
          <span style="font-size: 12px; color: var(--faint)">회의</span>
        </div>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; gap: 12px; padding: 22px 0">
        <span style="width: 2px; background: var(--line); flex-shrink: 0"></span>
        <p style="margin: 0; font-size: 15px; line-height: 1.75; color: var(--muted); text-wrap: pretty">괜찮다고 하시는데 목소리는 좀 다르네요. 무슨 일 있으셨어요?</p>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; flex-direction: column; gap: 12px; padding: 22px 0">
        <p style="margin: 0; font-size: 16px; line-height: 1.75; color: var(--paper); text-wrap: pretty">회의가 세 개나 있었는데, 뭐 늘 그렇죠</p>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--cool); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">0.31</span></div>
          <div style="display: flex; align-items: baseline; gap: 6px"><span style="width: 10px; height: 2px; background: var(--warm); margin-bottom: 3px"></span><span style="font-size: 12px; color: var(--muted)">−0.44</span></div>
          <span style="width: 1px; height: 10px; background: var(--line)"></span>
          <span style="font-size: 12px; color: var(--muted)">갭 0.75</span>
          <span style="font-size: 12px; color: var(--faint)">회의</span>
        </div>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
    </div>
    <div style="flex-grow: 1"></div>
  </div>

  <sc-if value="{{confirmDelete}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: var(--bg); opacity: 0.6"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--lift); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 32px 24px 36px 24px; display: flex; flex-direction: column">
      <p class="serif" style="margin: 0; font-size: 24px; line-height: 1.6">이 대화를 지울까요?</p>
      <div style="padding: 20px 0 0 0; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 15px; line-height: 1.75; color: var(--muted); text-wrap: pretty">9월 14일 대화와 발화 12건이 지워집니다.</p><p style="margin: 0; font-size: 15px; line-height: 1.75; color: var(--muted); text-wrap: pretty"><span style="color: var(--paper)">이 대화를 근거로 한 발견 1건도 함께 사라집니다.</span> 근거가 3건 미만이 되면 그 발견은 더 이상 성립하지 않기 때문입니다.</p></div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 32px 0 0 0">
        <button style="height: 56px; background: var(--accent); color: var(--onAccent); font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; border-radius: 2px">취소</button>
        <button style="height: 56px; border: 1px solid var(--line); color: var(--paper); font-size: 15px; display: flex; align-items: center; justify-content: center; border-radius: 2px">지우기</button>
      </div>
    </div>
  </sc-if>


</div>
</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "section": "테마"},
  "confirmDelete": {"editor": "boolean", "default": false, "section": "상태"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { th: { cls: theme === 'light' ? 'n-light' : 'n-dark' }, confirmDelete: !!this.props.confirmDelete };
  }
}
</script>
</body>
</html>
