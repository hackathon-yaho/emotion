<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    .n a { color: var(--accent); text-decoration: none; }
    .n a:hover { opacity: 0.75; }
    .n-dark {
      --bg: #0D0D0C; --lift: #161614; --paper: #F2EFE9; --muted: #8A8781; --faint: #55534E;
      --line: rgba(242,239,233,0.12); --hair: rgba(242,239,233,0.07);
      --accent: #C98A4B; --care: #C98087; --cool: #5A8FC9; --warm: #C25A38;
      --shade: rgba(242,239,233,0.07); --onAccent: #0D0D0C;
    }
    .n-light {
      --bg: #F5F2EC; --lift: #FFFFFF; --paper: #1A1815; --muted: #6B675F; --faint: #9A968D;
      --line: rgba(26,24,21,0.14); --hair: rgba(26,24,21,0.07);
      --accent: #8A5A22; --care: #A85A62; --cool: #2F6FA8; --warm: #B5411F;
      --shade: rgba(26,24,21,0.06); --onAccent: #FFFFFF;
    }
    .n { font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .n .serif { font-family: 'Gowun Batang', 'Noto Sans KR', serif; }
    .n .lab { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); }
    .n button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
    .n .dbl { position: relative; }
    .n .dbl .under { position: absolute; left: 3px; top: 3px; color: var(--warm); opacity: 0.45; }
    .n .dbl .over { position: relative; }
  </style>
</helmet>

<div class="n {{th.cls}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; padding: 40px 24px 0 24px">
    <button style="width: 44px; height: 44px; display: flex; align-items: center; color: var(--muted); margin-left: -12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 24px; overflow: hidden">
    <p class="serif" style="margin: 20px 0 0 0; font-size: 26px">설정</p>

    <div style="padding: 32px 0 0 0">
      <p class="lab" style="margin: 0 0 4px 0">화면</p>
      <div style="display: flex; flex-direction: column">
      <div style="height: 1px; background: var(--line)"></div>
      <button style="display: flex; align-items: center; justify-content: space-between; height: 60px; width: 100%">
        <span style="font-size: 16px; color: var(--paper)">테마</span>
        <span style="font-size: 14px; color: var(--muted)">시스템 설정</span>
      </button>
        <div style="height: 1px; background: var(--line)"></div>
      </div>
    </div>

    <div style="padding: 28px 0 0 0">
      <p class="lab" style="margin: 0 0 4px 0">안내</p>
      <div style="display: flex; flex-direction: column">
      <div style="height: 1px; background: var(--line)"></div>
      <button style="display: flex; align-items: center; justify-content: space-between; height: 60px; width: 100%">
        <span style="font-size: 16px; color: var(--paper)">처음 안내 다시 보기</span>
        <span style="color: var(--faint); display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h13M13 7l5 5-5 5"/></svg></span>
      </button>
      <div style="height: 1px; background: var(--line)"></div>
      <button style="display: flex; align-items: center; justify-content: space-between; height: 60px; width: 100%">
        <span style="font-size: 16px; color: var(--paper)">목소리·기록 처리 방식</span>
        <span style="color: var(--faint); display: flex"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 12h13M13 7l5 5-5 5"/></svg></span>
      </button>
        <div style="height: 1px; background: var(--line)"></div>
      </div>
      <p style="margin: 12px 0 0 0; font-size: 12px; line-height: 1.7; color: var(--faint); text-wrap: pretty">목소리 원본은 저장하지 않습니다. 발화 텍스트는 암호화되어 보관되고, 카카오 계정 정보는 감정 기록과 분리되어 있습니다.</p>
    </div>

    <div style="padding: 28px 0 0 0">
      <p class="lab" style="margin: 0 0 4px 0">시연</p>
      <div style="display: flex; flex-direction: column">
        <div style="height: 1px; background: var(--line)"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; height: 60px">
          <span style="font-size: 16px; color: var(--paper)">데모 모드</span>
          <span style="width: 44px; height: 26px; border-radius: 999px; border: 1px solid var(--line); display: flex; align-items: center; padding: 0 3px"><span style="width: 18px; height: 18px; border-radius: 999px; background: var(--faint)"></span></span>
        </div>
        <div style="height: 1px; background: var(--line)"></div>
      </div>
      <p style="margin: 12px 0 0 0; font-size: 12px; line-height: 1.7; color: var(--faint); text-wrap: pretty">대화 중 화면에 측정값을 표시합니다. 평소에는 꺼두세요.</p>
    </div>

    <div style="flex-grow: 1"></div>

    <div style="display: flex; flex-direction: column; padding-bottom: 36px">
      <div style="height: 1px; background: var(--line)"></div>
      <button style="display: flex; align-items: center; justify-content: space-between; height: 60px; width: 100%">
        <span style="font-size: 16px; color: var(--paper)">로그아웃</span>
        
      </button>
      <div style="height: 1px; background: var(--line)"></div>
      <button style="display: flex; align-items: center; justify-content: space-between; height: 60px; width: 100%">
        <span style="font-size: 16px; color: var(--muted)">탈퇴</span>
        
      </button>
      <div style="height: 1px; background: var(--line)"></div>
    </div>
  </div>

  <sc-if value="{{confirmLeave}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; background: var(--bg); opacity: 0.6"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--lift); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; padding: 32px 24px 36px 24px; display: flex; flex-direction: column">
      <p class="serif" style="margin: 0; font-size: 24px; line-height: 1.6">계정을 지울까요?</p>
      <div style="padding: 20px 0 0 0; display: flex; flex-direction: column; gap: 12px"><p style="margin: 0; font-size: 15px; line-height: 1.75; color: var(--muted); text-wrap: pretty">대화 12건과 발견 3건이 지금 바로 모두 지워집니다.</p><p style="margin: 0; font-size: 15px; line-height: 1.75; color: var(--muted); text-wrap: pretty"><span style="color: var(--paper)">유예 기간이 없고 되돌릴 수 없습니다.</span> 같은 카카오 계정으로 다시 시작하면 새 사용자가 됩니다.</p></div>
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 32px 0 0 0">
        <button style="height: 56px; background: var(--accent); color: var(--onAccent); font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; border-radius: 2px">취소</button>
        <button style="height: 56px; border: 1px solid var(--line); color: var(--paper); font-size: 15px; display: flex; align-items: center; justify-content: center; border-radius: 2px">모두 지우고 탈퇴</button>
      </div>
    </div>
  </sc-if>


</div>
</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "section": "테마"},
  "confirmLeave": {"editor": "boolean", "default": false, "section": "상태"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { th: { cls: theme === 'light' ? 'n-light' : 'n-dark' }, confirmLeave: !!this.props.confirmLeave };
  }
}
</script>
</body>
</html>
