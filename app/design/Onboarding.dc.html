<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    .n a { color: var(--accent); text-decoration: none; }
    .n a:hover { opacity: 0.75; }
    .n-dark {
      --bg: #0D0D0C; --lift: #161614; --paper: #F2EFE9; --muted: #8A8781; --faint: #55534E;
      --line: rgba(242,239,233,0.12); --hair: rgba(242,239,233,0.07);
      --accent: #C98A4B; --care: #C98087; --cool: #5A8FC9; --warm: #C25A38;
      --shade: rgba(242,239,233,0.07); --onAccent: #0D0D0C;
    }
    .n-light {
      --bg: #F5F2EC; --lift: #FFFFFF; --paper: #1A1815; --muted: #6B675F; --faint: #9A968D;
      --line: rgba(26,24,21,0.14); --hair: rgba(26,24,21,0.07);
      --accent: #8A5A22; --care: #A85A62; --cool: #2F6FA8; --warm: #B5411F;
      --shade: rgba(26,24,21,0.06); --onAccent: #FFFFFF;
    }
    .n { font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .n .serif { font-family: 'Gowun Batang', 'Noto Sans KR', serif; }
    .n .lab { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); }
    .n button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
    .n .dbl { text-shadow: 3px 3px 0 var(--dblShadow); }
  </style>
</helmet>

<div class="n {{th.cls}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="padding: 40px 24px 0 24px">
    <div style="display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 2px; padding: 8px 12px">
      <span style="width: 4px; height: 4px; border-radius: 999px; background: var(--muted)"></span>
      <span style="font-size: 11px; letter-spacing: 0.08em; color: var(--muted)">전문 상담·치료를 대체하지 않습니다</span>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 0 24px; overflow: hidden">
    <div style="padding: 56px 0 0 0">
      <p class="serif" style="margin: 0; font-size: 30px; line-height: 1.65; text-wrap: pretty">말로 하루를<br>이야기하면,<br>말투에서 마음을 읽습니다.</p>
    </div>

    <div style="padding: 44px 0 0 0; display: flex; flex-direction: column; gap: 0">
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; gap: 16px; padding: 20px 0">
        <p class="lab" style="margin: 2px 0 0 0; width: 18px; flex-shrink: 0">01</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); text-wrap: pretty">목소리는 <span style="color: var(--paper)">분석 직후 삭제</span>되고 어디에도 저장되지 않습니다.</p>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; gap: 16px; padding: 20px 0">
        <p class="lab" style="margin: 2px 0 0 0; width: 18px; flex-shrink: 0">02</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); text-wrap: pretty">감정을 단정하지 않습니다. 말과 목소리가 다를 때 <span style="color: var(--paper)">되물을 뿐</span>입니다.</p>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
      <div style="display: flex; gap: 16px; padding: 20px 0">
        <p class="lab" style="margin: 2px 0 0 0; width: 18px; flex-shrink: 0">03</p>
        <p style="margin: 0; font-size: 15px; line-height: 1.7; color: var(--muted); text-wrap: pretty">힘들 땐 <span style="color: var(--paper)">자살예방 상담전화 109</span>로 24시간 연결됩니다.</p>
      </div>
      <div style="height: 1px; background: var(--line)"></div>
    </div>

    <div style="flex-grow: 1"></div>

    <button style="height: 54px; background: #FEE500; color: rgba(0,0,0,0.85); font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 6px">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3.2c-5.1 0-9.2 3.2-9.2 7.2 0 2.5 1.6 4.7 4.1 6l-1 3.7c-.1.3.2.6.5.4l4.3-2.8c.4 0 .9.1 1.3.1 5.1 0 9.2-3.2 9.2-7.4S17.1 3.2 12 3.2z"/></svg>
      카카오로 시작하기
    </button>
    <p style="margin: 16px 0 40px 0; text-align: center; font-size: 11px; line-height: 1.7; letter-spacing: 0.04em; color: var(--faint)">시작하면 위 내용에 동의한 것으로 봅니다</p>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "section": "테마"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { th: { cls: theme === 'light' ? 'n-light' : 'n-dark' } };
  }
}
</script>
</body>
</html>
