<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    .n a { color: var(--accent); text-decoration: none; }
    .n a:hover { opacity: 0.75; }
    .n-dark {
      --bg: #0D0D0C; --lift: #161614; --paper: #F2EFE9; --muted: #8A8781; --faint: #55534E;
      --line: rgba(242,239,233,0.12); --hair: rgba(242,239,233,0.07);
      --accent: #C98A4B; --care: #C98087; --cool: #5A8FC9; --warm: #C25A38;
      --shade: rgba(242,239,233,0.07); --onAccent: #0D0D0C;
    }
    .n-light {
      --bg: #F5F2EC; --lift: #FFFFFF; --paper: #1A1815; --muted: #6B675F; --faint: #9A968D;
      --line: rgba(26,24,21,0.14); --hair: rgba(26,24,21,0.07);
      --accent: #8A5A22; --care: #A85A62; --cool: #2F6FA8; --warm: #B5411F;
      --shade: rgba(26,24,21,0.06); --onAccent: #FFFFFF;
    }
    .n { font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .n .serif { font-family: 'Gowun Batang', 'Noto Sans KR', serif; }
    .n .lab { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); }
    .n button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
    .n .dbl { text-shadow: 3px 3px 0 var(--dblShadow); }
  </style>
</helmet>

<div class="n {{th.cls}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="position: absolute; inset: 0; background: var(--bg); opacity: 0.55"></div>

  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; justify-content: flex-end">

    <div style="padding: 0 24px 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; opacity: 0.35">
      <span style="position: relative; width: 96px; height: 96px; display: block">
        <span style="position: absolute; left: 0; top: 0; width: 88px; height: 88px; border-radius: 999px; border: 1px solid var(--cool)"></span>
        <span style="position: absolute; left: 8px; top: 8px; width: 88px; height: 88px; border-radius: 999px; border: 1px solid var(--warm)"></span>
      </span>
      <p style="margin: 0; font-size: 14px; color: var(--muted)">대화는 계속되고 있습니다</p>
    </div>

    <div style="background: var(--lift); border-top: 1px solid var(--care); border-radius: 20px 20px 0 0; padding: 28px 24px 36px 24px; display: flex; flex-direction: column">

      <div style="display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; margin-bottom: 24px">
        <span style="width: 4px; height: 4px; border-radius: 999px; background: var(--care)"></span>
        <span style="font-size: 11px; letter-spacing: 0.08em; color: var(--muted)">전문 상담·치료를 대체하지 않습니다</span>
      </div>

      <p class="serif" style="margin: 0; font-size: 24px; line-height: 1.7; text-wrap: pretty">혼자 견디지 않으셔도 됩니다.<br>지금 이야기할 사람이 있습니다.</p>

      <div style="padding: 28px 0 0 0">
        <p class="lab" style="margin: 0 0 10px 0">자살예방 상담전화 · 24시간</p>
        <div style="display: flex; align-items: baseline; gap: 14px">
          <p class="serif" style="margin: 0; font-size: 52px; line-height: 1; letter-spacing: 0.02em; color: var(--paper)">109</p>
          <p style="margin: 0; font-size: 13px; color: var(--muted)">무료 · 익명</p>
        </div>
      </div>

      <div style="display: flex; gap: 8px; padding: 28px 0 0 0">
        <button style="flex-grow: 1; height: 56px; background: var(--care); color: var(--onAccent); font-size: 16px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 2px">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a1 1 0 01-1 1A16 16 0 014 5a1 1 0 011-1z"/></svg>
          전화 연결
        </button>
        <button style="width: 112px; height: 56px; border: 1px solid var(--line); color: var(--paper); font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 2px">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M9 9h11v11H9z"/><path d="M15 5H4v11"/></svg>
          복사
        </button>
      </div>
      <p style="margin: 14px 0 0 0; font-size: 12px; line-height: 1.7; color: var(--faint); text-wrap: pretty">컴퓨터에서는 전화가 걸리지 않습니다. 번호를 복사해 휴대폰으로 걸어 주세요.</p>

      <button style="height: 52px; margin: 20px 0 0 0; font-size: 15px; color: var(--muted); display: flex; align-items: center; justify-content: center">대화로 돌아가기</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "section": "테마"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { th: { cls: theme === 'light' ? 'n-light' : 'n-dark' } };
  }
}
</script>
</body>
</html>
