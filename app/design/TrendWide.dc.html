<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    .n a { color: var(--accent); text-decoration: none; }
    .n a:hover { opacity: 0.75; }
    .n-dark {
      --bg: #0D0D0C; --lift: #161614; --paper: #F2EFE9; --muted: #8A8781; --faint: #55534E;
      --line: rgba(242,239,233,0.12); --hair: rgba(242,239,233,0.07);
      --accent: #C98A4B; --care: #C98087; --cool: #5A8FC9; --warm: #C25A38;
      --shade: rgba(242,239,233,0.07); --onAccent: #0D0D0C;
    }
    .n-light {
      --bg: #F5F2EC; --lift: #FFFFFF; --paper: #1A1815; --muted: #6B675F; --faint: #9A968D;
      --line: rgba(26,24,21,0.14); --hair: rgba(26,24,21,0.07);
      --accent: #8A5A22; --care: #A85A62; --cool: #2F6FA8; --warm: #B5411F;
      --shade: rgba(26,24,21,0.06); --onAccent: #FFFFFF;
    }
    .n { font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .n .serif { font-family: 'Gowun Batang', 'Noto Sans KR', serif; }
    .n .lab { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); }
    .n button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
    .n .dbl { text-shadow: 3px 3px 0 var(--dblShadow); }
  </style>
</helmet>

<div class="n {{th.cls}}" style="width: 900px; height: 620px; background: var(--bg); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 40px 44px 0 44px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <p class="lab" style="margin: 0">감정 추세 · 30일</p>
      <p class="dbl serif" style="margin: 0; font-size: 34px; line-height: 1.3">말한 내용과 목소리</p>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{ranges}}" as="r" hint-placeholder-count="2">
        <button onClick="{{r.pick}}" style="height: 48px; padding: 0 20px; border: 1px solid {{r.border}}; color: {{r.color}}; font-size: 14px; display: flex; align-items: center; border-radius: 2px">{{r.name}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex-grow: 1; padding: 36px 44px 0 44px; position: relative">
    <svg width="812" height="374" viewBox="0 0 812 374" fill="none" style="display: block">
      <rect x="{{chart.hl.x}}" y="16" width="{{chart.hl.w}}" height="288" fill="var(--shade)"></rect>
      <line x1="40" y1="160" x2="796" y2="160" stroke="var(--line)" stroke-width="1"></line>
      <text x="0" y="20" fill="var(--faint)" font-size="12" font-family="'Noto Sans KR', sans-serif">+1</text>
      <text x="10" y="164" fill="var(--faint)" font-size="12" font-family="'Noto Sans KR', sans-serif">0</text>
      <text x="0" y="308" fill="var(--faint)" font-size="12" font-family="'Noto Sans KR', sans-serif">−1</text>
      <sc-for list="{{chart.ticks}}" as="k" hint-placeholder-count="8">
        <text x="{{k.x}}" y="332" fill="var(--faint)" font-size="12" text-anchor="middle" font-family="'Noto Sans KR', sans-serif">{{k.d}}</text>
      </sc-for>
      <sc-for list="{{chart.textSegs}}" as="d" hint-placeholder-count="2">
        <path d="{{d.p}}" stroke="var(--cool)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-for>
      <sc-for list="{{chart.voiceSegs}}" as="d" hint-placeholder-count="2">
        <path d="{{d.p}}" stroke="var(--warm)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </sc-for>
      <sc-for list="{{chart.dots}}" as="p" hint-placeholder-count="10">
        <circle cx="{{p.x}}" cy="{{p.y}}" r="4" fill="{{p.fill}}"></circle>
      </sc-for>
      <sc-if value="{{hasHover}}" hint-placeholder-val="{{ true }}">
        <line x1="{{hover.x}}" y1="16" x2="{{hover.x}}" y2="304" stroke="var(--faint)" stroke-width="1"></line>
      </sc-if>
      <sc-for list="{{chart.hits}}" as="h" hint-placeholder-count="14">
        <rect x="{{h.x}}" y="16" width="{{h.w}}" height="288" fill="transparent" onMouseEnter="{{h.enter}}" onMouseLeave="{{h.leave}}"></rect>
      </sc-for>
    </svg>

    <sc-if value="{{hasHover}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: {{hover.boxX}}px; top: 56px; background: var(--lift); border: 1px solid var(--line); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; pointer-events: none; min-width: 168px">
        <p class="lab" style="margin: 0">{{hover.d}}</p>
        <div style="display: flex; justify-content: space-between; gap: 20px"><span style="font-size: 13px; color: var(--muted)">말한 내용</span><span style="font-size: 13px; color: var(--paper)">{{hover.t}}</span></div>
        <div style="display: flex; justify-content: space-between; gap: 20px"><span style="font-size: 13px; color: var(--muted)">목소리</span><span style="font-size: 13px; color: var(--paper)">{{hover.v}}</span></div>
        <div style="height: 1px; background: var(--line)"></div>
        <div style="display: flex; justify-content: space-between; gap: 20px"><span style="font-size: 13px; color: var(--muted)">갭</span><span style="font-size: 13px; color: var(--paper)">{{hover.g}}</span></div>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; align-items: center; gap: 26px; padding: 0 44px 36px 44px">
    <div style="display: flex; align-items: center; gap: 8px"><span style="width: 16px; height: 2px; background: var(--cool)"></span><span style="font-size: 13px; color: var(--muted)">말한 내용</span></div>
    <div style="display: flex; align-items: center; gap: 8px"><span style="width: 16px; height: 2px; background: var(--warm)"></span><span style="font-size: 13px; color: var(--muted)">목소리</span></div>
    <div style="display: flex; align-items: center; gap: 8px"><span style="width: 16px; height: 8px; background: var(--shade)"></span><span style="font-size: 13px; color: var(--muted)">두 선이 벌어진 구간</span></div>
    <div style="flex-grow: 1"></div>
    <p style="margin: 0; font-size: 13px; color: var(--faint)">기록이 없는 날은 선을 잇지 않습니다</p>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "section": "테마"},
  "$preview": {"width": 900, "height": 620}
}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { range: '30d', hover: null }; }

  data() {
    return [
      { d: '9/1', t: 0.35, v: 0.20 }, { d: '9/2', t: 0.42, v: 0.10 },
      { d: '9/3', t: 0.30, v: -0.05 }, { d: '9/4', t: null, v: null },
      { d: '9/5', t: 0.55, v: -0.20 }, { d: '9/6', t: 0.61, v: -0.42 },
      { d: '9/7', t: 0.58, v: -0.50 }, { d: '9/8', t: 0.44, v: -0.30 },
      { d: '9/9', t: null, v: null }, { d: '9/10', t: null, v: null },
      { d: '9/11', t: 0.20, v: 0.11 }, { d: '9/12', t: 0.15, v: 0.05 },
      { d: '9/13', t: -0.10, v: -0.22 }, { d: '9/14', t: 0.25, v: 0.18 }
    ];
  }

  gapRun(rows, threshold) {
    const th = threshold ?? 0.85;
    let best = null; let cur = null;
    rows.forEach((r, i) => {
      const over = r.t !== null && r.v !== null && Math.abs(r.t - r.v) > th;
      if (over) {
        cur = cur === null ? { from: i, to: i } : { from: cur.from, to: i };
        if (best === null || cur.to - cur.from >= best.to - best.from) best = cur;
      } else { cur = null; }
    });
    return best;
  }

  fmt(n) {
    if (n === null || n === undefined) return '—';
    return (n < 0 ? '−' : '') + Math.abs(n).toFixed(2);
  }

  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const all = this.data();
    const range = this.state.range;
    const rows = range === '7d' ? all.slice(-7) : all;

    const padL = 40; const plotW = 756; const top = 16; const plotH = 288;
    const step = plotW / (rows.length - 1);
    const x = (i) => padL + i * step;
    const y = (val) => top + ((1 - val) / 2) * plotH;

    const segs = (key) => {
      const out = []; let cur = [];
      rows.forEach((r, i) => {
        if (r[key] === null) { if (cur.length) { out.push(cur); cur = []; } }
        else { cur.push(x(i).toFixed(1) + ',' + y(r[key]).toFixed(1)); }
      });
      if (cur.length) out.push(cur);
      return out.filter((c) => c.length > 1).map((c) => ({ p: 'M' + c.join(' L') }));
    };

    const dots = [];
    rows.forEach((r, i) => {
      if (r.t !== null) dots.push({ x: x(i).toFixed(1), y: y(r.t).toFixed(1), fill: 'var(--cool)' });
      if (r.v !== null) dots.push({ x: x(i).toFixed(1), y: y(r.v).toFixed(1), fill: 'var(--warm)' });
    });

    const hits = rows.map((r, i) => ({
      x: (x(i) - step / 2).toFixed(1), w: step.toFixed(1),
      enter: () => this.setState({ hover: i }),
      leave: () => this.setState({ hover: null })
    }));

    const run = this.gapRun(rows);
    const hl = run === null ? { x: '0', w: '0' }
      : { x: (x(run.from) - step / 2).toFixed(1), w: ((run.to - run.from + 1) * step).toFixed(1) };

    const hi = this.state.hover;
    const hr = hi === null || hi === undefined || hi >= rows.length ? null : rows[hi];
    const gap = hr && hr.t !== null && hr.v !== null ? Math.abs(hr.t - hr.v) : null;

    const ranges = ['7d', '30d'].map((k) => ({
      name: k === '7d' ? '7일' : '30일',
      pick: () => this.setState({ range: k, hover: null }),
      border: range === k ? 'var(--accent)' : 'var(--line)',
      color: range === k ? 'var(--paper)' : 'var(--faint)'
    }));

    return {
      th: { cls: theme === 'light' ? 'n-light' : 'n-dark' },
      ranges: ranges,
      chart: {
        textSegs: segs('t'), voiceSegs: segs('v'), dots: dots, hits: hits,
        ticks: rows.map((r, i) => ({ x: x(i).toFixed(1), d: r.d })), hl: hl
      },
      hasHover: hr !== null,
      hover: hr === null ? { x: 0, boxX: 0, d: '', t: '', v: '', g: '' } : {
        x: x(hi).toFixed(1),
        boxX: Math.min(x(hi) + 12, 812 - 190).toFixed(0),
        d: hr.d, t: this.fmt(hr.t), v: this.fmt(hr.v),
        g: gap === null ? '—' : gap.toFixed(2)
      }
    };
  }
}
</script>
</body>
</html>
