<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    .n a { color: var(--accent); text-decoration: none; }
    .n a:hover { opacity: 0.75; }
    .n-dark {
      --bg: #0D0D0C; --lift: #161614; --paper: #F2EFE9; --muted: #8A8781; --faint: #55534E;
      --line: rgba(242,239,233,0.12); --hair: rgba(242,239,233,0.07);
      --accent: #C98A4B; --care: #C98087; --cool: #5A8FC9; --warm: #C25A38;
      --shade: rgba(242,239,233,0.07); --onAccent: #0D0D0C;
    }
    .n-light {
      --bg: #F5F2EC; --lift: #FFFFFF; --paper: #1A1815; --muted: #6B675F; --faint: #9A968D;
      --line: rgba(26,24,21,0.14); --hair: rgba(26,24,21,0.07);
      --accent: #8A5A22; --care: #A85A62; --cool: #2F6FA8; --warm: #B5411F;
      --shade: rgba(26,24,21,0.06); --onAccent: #FFFFFF;
    }
    .n { font-family: 'Noto Sans KR', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .n .serif { font-family: 'Gowun Batang', 'Noto Sans KR', serif; }
    .n .lab { font-size: 11px; letter-spacing: 0.14em; color: var(--faint); }
    .n button { background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; text-align: left; }
    .n .dbl { position: relative; }
    .n .dbl .under { position: absolute; left: 3px; top: 3px; color: var(--warm); opacity: 0.45; }
    .n .dbl .over { position: relative; }
  </style>
</helmet>

<div class="n {{th.cls}}" style="width: 390px; height: 844px; background: var(--bg); color: var(--paper); display: flex; flex-direction: column; overflow: hidden; position: relative">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 40px 24px 0 24px">
    <button style="width: 44px; height: 44px; display: flex; align-items: center; color: var(--muted); margin-left: -12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M14.5 6l-6 6 6 6"/></svg></button>
    <sc-if value="{{demo}}" hint-placeholder-val="{{ false }}">
      <span class="lab" style="letter-spacing: 0.16em; color: var(--accent)">DEMO</span>
    </sc-if>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 44px; padding: 0 32px">
    <div style="position: relative; width: 208px; height: 208px; display: flex; align-items: center; justify-content: center">
      <span style="position: absolute; left: {{ring.ax}}px; top: {{ring.ax}}px; width: {{ring.size}}px; height: {{ring.size}}px; border-radius: 999px; border: 1px solid var(--cool); opacity: {{ring.o1}}"></span>
      <span style="position: absolute; left: {{ring.bx}}px; top: {{ring.bx}}px; width: {{ring.size}}px; height: {{ring.size}}px; border-radius: 999px; border: 1px solid var(--warm); opacity: {{ring.o2}}"></span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; min-height: 120px">
      <p class="lab" style="margin: 0">{{ring.label}}</p>
      <sc-if value="{{ring.hasCaption}}" hint-placeholder-val="{{ true }}">
        <p class="serif" style="margin: 0; font-size: 22px; line-height: 1.65; text-align: center; text-wrap: pretty">{{ring.caption}}</p>
      </sc-if>
      <sc-if value="{{ring.hasSub}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 13px; color: var(--faint); text-align: center">{{ring.sub}}</p>
      </sc-if>
      <sc-if value="{{ring.hasErr}}" hint-placeholder-val="{{ false }}">
        <p style="margin: 0; font-size: 16px; line-height: 1.75; color: var(--muted); text-align: center; text-wrap: pretty">{{ring.err}}</p>
      </sc-if>
    </div>
  </div>

  <sc-if value="{{ring.nearEnd}}" hint-placeholder-val="{{ false }}">
    <p style="margin: 0 24px 12px 24px; text-align: center; font-size: 13px; color: var(--faint)">잠시 뒤 오늘 대화가 마무리됩니다</p>
  </sc-if>

  <div style="padding: 0 24px 16px 24px; display: flex; flex-direction: column; gap: 10px">
    <p class="lab" style="margin: 0">상태 — 프로토타입 전환용</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
        <button onClick="{{s.pick}}" style="height: 48px; border: 1px solid {{s.border}}; color: {{s.color}}; font-size: 12px; display: flex; align-items: center; justify-content: center; border-radius: 2px; text-align: center; line-height: 1.3">{{s.name}}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 0 24px 40px 24px">
    <button style="width: 100%; height: 56px; border: 1px solid {{ring.ctaBorder}}; background: {{ring.ctaBg}}; color: {{ring.ctaColor}}; font-size: 15px; font-weight: {{ring.ctaWeight}}; display: flex; align-items: center; justify-content: center; border-radius: 2px">{{ring.cta}}</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{
  "theme": {"editor": "enum", "options": ["dark", "light"], "default": "dark", "section": "테마"},
  "demoMode": {"editor": "boolean", "default": false, "section": "데모"},
  "$preview": {"width": 390, "height": 844}
}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 2 }; }

  states() {
    const dim = { size: 160, gap: 2, o1: 0.16, o2: 0.12 };
    return [
      { name: '연결 중', label: '연결하고 있습니다', caption: '', size: 176, gap: 4, o1: 0.3, o2: 0.2 },
      { name: '이어하기', label: '이어서 듣고 있습니다', caption: '', size: 200, gap: 8, o1: 0.85, o2: 0.6,
        sub: '중단된 대화를 이어갑니다 · 남은 시간 4분 42초' },
      { name: '듣는 중', label: '듣고 있습니다', caption: '오늘 완전 괜찮았어요', size: 200, gap: 8, o1: 0.85, o2: 0.6 },
      { name: '말하는 중', label: '말하고 있습니다', caption: '', size: 168, gap: 3, o1: 0.5, o2: 0.35 },
      { name: '조용', label: '듣고 있습니다', caption: '', size: 184, gap: 5, o1: 0.5, o2: 0.32 },
      { name: '마무리 임박', label: '듣고 있습니다', caption: '그래서 좀 지치더라고요', size: 196, gap: 7, o1: 0.8, o2: 0.55, nearEnd: true },
      { name: '마이크 거부', label: '마이크가 꺼져 있습니다', caption: '', ...dim,
        err: '마이크를 사용할 수 없습니다. 브라우저 설정에서 이 사이트의 마이크를 허용해 주세요.', cta: '설정 열기', primary: true },
      { name: '네트워크 끊김', label: '연결이 끊어졌습니다', caption: '', ...dim,
        err: '연결이 끊어졌습니다. 다시 연결해 볼까요?', cta: '다시 연결', primary: true },
      { name: '연결 불가', label: '시작할 수 없습니다', caption: '', ...dim,
        err: '지금은 대화를 시작할 수 없습니다. 잠시 후 다시 시도해 주세요.', cta: '다시 시도', primary: true }
    ];
  }

  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const all = this.states();
    const i = this.state.step % all.length;
    const c = all[i];
    const box = 208;
    const primary = !!c.primary;
    return {
      th: { cls: theme === 'light' ? 'n-light' : 'n-dark' },
      demo: !!this.props.demoMode,
      ring: {
        label: c.label, caption: c.caption, hasCaption: c.caption.length > 0,
        hasErr: !!c.err, err: c.err ?? '', nearEnd: !!c.nearEnd,
        hasSub: !!c.sub, sub: c.sub ?? '',
        size: c.size, o1: c.o1, o2: c.o2,
        ax: ((box - c.size) / 2 - c.gap / 2).toFixed(1),
        bx: ((box - c.size) / 2 + c.gap / 2).toFixed(1),
        cta: c.cta ?? '대화 마치기',
        ctaBg: primary ? 'var(--accent)' : 'transparent',
        ctaBorder: primary ? 'var(--accent)' : 'var(--line)',
        ctaColor: primary ? 'var(--onAccent)' : 'var(--paper)',
        ctaWeight: primary ? 500 : 400
      },
      steps: all.map((s, idx) => ({
        name: s.name,
        pick: () => this.setState({ step: idx }),
        border: idx === i ? 'var(--accent)' : 'var(--line)',
        color: idx === i ? 'var(--paper)' : 'var(--faint)'
      }))
    };
  }
}
</script>
</body>
</html>
