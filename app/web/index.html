<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="감정 케어 보이스 저널 — 말투에서 감정을 읽는 음성 저널">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="보이스 저널">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon · 앱 아이콘 — S02의 어긋난 두 링 (design-system §1).
       차가운 링 = 말한 내용, 따뜻한 링 = 목소리. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- 브라우저 UI 색 — 시스템 설정을 따른다. manifest의 theme_color는
       값을 하나만 가질 수 있어 여기서 갈라 준다. -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F2EC">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0D0C">

  <style>
    /*
      부팅 전 배경 — **흰 플래시를 막는다.**

      Flutter 웹은 CanvasKit을 받는 동안 빈 문서를 보여주는데, 기본 흰색이라
      다크 테마에서 매번 화면이 번쩍인다(첫 로드에 gzip 3.6MB를 받는다).
      토큰 값과 같은 색을 깔아 둔다 — design-system §4.
    */
    html, body { margin: 0; padding: 0; background-color: #F5F2EC; }
    @media (prefers-color-scheme: dark) {
      html, body { background-color: #0D0D0C; }
    }
  </style>

  <!-- 제품 이름은 미확정이다 (PRD §14-6). 확정되면 이 제목과
       manifest.json의 name·short_name, main.dart의 title을 함께 고친다. -->
  <title>감정 케어 보이스 저널</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
