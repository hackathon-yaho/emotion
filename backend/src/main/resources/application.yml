server:
  port: ${PORT:8080}

spring:
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # 스키마는 db/migration.sql이 단일 출처다 (data-model.md). JPA가 만들지 않는다.
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    # 계약 §1-1 — 매일 쓰는 앱이라 더 짧으면 재로그인이 잦아 이탈 요인이 된다.
    expiry-days: 7
  kakao:
    # 인가 코드를 토큰으로 교환한다 (계약 §2-1 v1.6). 인가 URL의 client_id도 같은 키다.
    rest-api-key: ${KAKAO_REST_API_KEY}
    # 카카오가 REST 키에 기본 활성화로 붙여 준다. 비어 있으면 안 보낸다.
    client-secret: ${KAKAO_CLIENT_SECRET:}
    # 앱이 보내온 redirectUri를 이 목록과 대조한다 — 열어두면 인가 코드를 남의 주소로
    # 흘릴 수 있는 자리다. 카카오 콘솔 등록값과 같아야 한다.
    redirect-uris: ${KAKAO_REDIRECT_URIS:https://hackathon-yaho.github.io/emotion/,http://localhost:3000/}
  scheduler:
    # F2-06 정리와 F7-01 배치가 같은 주기를 쓴다 (2026-09-04 확정, phase-1 1-7).
    fixed-delay-ms: 300000
  hume:
    # 단기 토큰 발급용. 앱에 내려보내지 않는다 (FR-013, TC-03).
    api-key: ${HUME_API_KEY}
    secret-key: ${HUME_SECRET_KEY}
    # 계약 §2-4에서 null이 될 수 없다. 기본값을 주지 않으므로 없으면 기동에 실패한다 —
    # 런타임 503으로 만들면 서버는 떠 있는데 모든 세션 시작이 실패한다.
    config-id: ${HUME_CONFIG_ID}
  internal:
    # AI서버 → 백엔드 인증 (계약 §3-1). 저장소에 넣지 않는다.
    shared-secret: ${INTERNAL_SHARED_SECRET}
  ai:
    # 백엔드 → AI서버 (계약 §3-5 요약 · §3-3 관찰).
    # AI 로컬 포트는 8100이다 (ai-server/.env.example의 AI_PORT) — 8000으로 잘못 적어뒀던 것을
    # 통합 준비 중에 잡았다. 계약에는 포트 규정이 없어 상대 .env.example이 출처다.
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8100}
    # 요약은 종료 응답을 붙잡는 동기 호출이라 짧게 끊는다. 실패하면 summary: null이다.
    summary-timeout-ms: 3000
    # 관찰 문장화는 배치라 사용자를 기다리게 하지 않는다 — 요약보다 넉넉히 준다.
    observation-timeout-ms: 10000
  crypto:
    # 발화 암호화 키 (F5-02). base64(16/24/32바이트).
    # ⚠️ 잃으면 도그푸딩 발화 전체가 복호화 불가다 — 세 시크릿 중 이것만 오프라인 사본을 둔다.
    transcript-key: ${TRANSCRIPT_ENC_KEY}
  session:
    # 앱에 상수로 박지 않고 서버가 내려준다 (계약 §2-4) — 정책 변경에 재배포가 필요 없다.
    soft-wrap-sec: 300
    hard-cut-sec: 420
    live-poll-interval-sec: 2
    # 초기 수치는 20쌍 측정 후 확정한다 (PRD §14-5). 어느 값이든 세션에 스냅샷된다.
    gap-threshold: ${GAP_THRESHOLD:0.85}
    # 마지막 발화 후 이만큼 지나면 이어하기가 끝나고 스케줄러가 정리한다.
    resume-window-min: 30

cors:
  # 앱은 GitHub Pages에 있어 오리진이 다르다. 커스텀 도메인이 붙으면 값만 바꾼다.
  # allowedOriginPatterns를 쓰므로 localhost:* 와일드카드가 그대로 통한다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://hackathon-yaho.github.io,http://localhost:*}

logging:
  level:
    com.hackathonyaho.voicejournal: info
  # 발화 내용·sessionId를 어떤 로그 문구에도 넣지 않는다 (FR-092, 절대 원칙 3·6번).
  # 세션 상관은 sessionRef(해시 8자)로만 한다.
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{sessionRef:-'-'}] %logger{36} - %msg%n"
