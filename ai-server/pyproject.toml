[project]
name = "emotion-ai-server"
version = "0.1.0"
description = "감정 케어 보이스 저널 — Hume CLM 엔드포인트 · valence · 갭 · 위기 규칙 · 프롬프트"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "anthropic>=1.0",
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "respx>=0.22",
    "ruff>=0.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
